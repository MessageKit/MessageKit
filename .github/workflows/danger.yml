name: Danger

# ready_for_review is not a default activity type, without it the draft
# warning sticks around after a Pull Request leaves draft state
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Danger posts its report as a comment and reports back as a commit status
permissions:
  contents: read
  pull-requests: write
  statuses: write

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  danger:
    name: Run Danger
    runs-on: macos-latest
    steps:
    - name: Checkout the Git repository
      uses: actions/checkout@v4
    - name: Install SwiftLint
      run: brew install swiftlint
    # Since 3.23.0 the danger/tap formula installs a prebuilt binary without the
    # libDanger library that compiles the Dangerfile, so build it from source.
    # The binary looks for the library in /opt/homebrew/lib/danger
    - name: Install Danger Swift
      run: |
        git clone --depth 1 --branch 3.23.0 https://github.com/danger/danger-swift.git "$RUNNER_TEMP/danger-swift"
        make -C "$RUNNER_TEMP/danger-swift" install PREFIX=/opt/homebrew
    # The tap ships danger-js as a pkg bundle whose embedded Node is too old to
    # read the GitHub API responses, so use the npm build on the runner's Node
    - name: Install Danger JS
      run: npm install danger@13
    - name: Run Danger
      run: /opt/homebrew/bin/danger-swift ci --failOnErrors --danger-js-path ./node_modules/.bin/danger
      env:
        DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
